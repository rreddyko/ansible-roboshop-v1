- name: configure catalog server
  hosts: catalog
  become: yes
  tasks:
  - name: disable default nodejs 
    command: dnf module disable nodejs -y
  - name: enable nodejs
    command: dnf module enable nodejs:24 -y

  - name: install nodejs
    dnf:
      name: nodejs
      state: present

  - name: create system user
    user: 
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/login
      comment: "roboshop system user"

  - name: remove existing directory
    file:
      path: /app
      state: absent
  
  - name: remove catalog.zip
    file:
      path: /tmp/catalog.zip
      state: absent

  - name: creating app directory
    file:
      path: /app
      state: directory

  - name: download catalog application
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
      dest: /tmp/catalogue.zip
  
  - name: unzip catalog
    unarchive:
      src: /tmp/catalog.zip
      dest: /app/
      
