- name: create ec2-instance
  hosts: localhost
  connection: local
  vars: 
    instances: ["mongodb", "redis", "mysql", "rabbitmq", "catalog", "cart", "user", "shipping","payment", "frontend"]
    action: create
    domain_name: "rameshkotha572.online"
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2-instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      instance_type: t3.micro
      image_id: "{{ ami_id }}"
      security_groups:
      - roboshop-common
      - "{{ item }}"
      region: us-east-1
    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output

  # - name: print ec2_output
  #   debug:
  #     msg: "{{ ec2_output }}"

  - name: create R53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}" #mongodb.rameshkotha572.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"

  - name: create R53 record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"  
    when: action == "create" and item.item == "frontend"


  - name: delete R53 records
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}.{{ domain_name }}"
      ttl: 1
      type: A
    loop: "{{ instances }}"
    when: action == "delete"
  
  - name: delete R53 records for front end
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      ttl: 1
      type: A
    loop: "{{ instances }}"
    when: action == "delete" and item.item == "frontend"
  
  - name: delete ec2 instances
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{ item }}"
      wait: false
    loop: "{{ instances }}"
    when: action == "delete"

    






