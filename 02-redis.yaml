- name: installing redis
  hosts: redis
  become: yes
  tasks: 
  - name: enable redis 7
    command: dnf module disable redis:7 -y

  - name: install redis
    package:
      name: redis
      state: present

  - name: allow remote and change default content
    replace:
      path: /etc/redis/redis.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'

  - name: change the protected mode
    lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^#?protected-mode yes'
      replace: 'protected-mode no'

  