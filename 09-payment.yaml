- name: configure payment server
  hosts: payment
  become: yes

- name: install python
  dnf:
    name:
    - python3.14
    - python3.14-pip
    state: present
  
- name: creating system user
  user:
    name: roboshop
    create_home: false
    home: /app
    system: true
    shell: /sbin/nologin
    comment: "roboshop system user"

- name: removing old directories
  file:
    path: /app
    state: absent

- name: removing payment.zip
  file:
    path: /tmp/payment.zip
    state: absent

- name: creating a directory
  file:
    path: /app
    state: directory

- name: downloading the payment application
  get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/payment-v4.zip
    dest: /tmp/payment.zip

- name: unzipping payment zip
  unarchive:
    src: /tmp/payment.zip
    dest: /app
    remote_src: yes

- name: installing dependencies in virtual en
  ansible.builtin.pip:  
    requirements: /app/requirements.txt
    virtualenv: /app/.venv
	  virtualenv_command: python3.14 -m venv






