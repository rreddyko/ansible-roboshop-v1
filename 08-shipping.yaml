- name: configuring shipping server
  hosts: shipping
  become: yes
  tasks:
  - name: enable maven 3.9
    command: dnf module enable maven:3.9 -y

  - name: installing maven and java
    dnf:
      name:
      - maven
      - java-25-openjdk-devel
      - maven-openjdk25 # installing this as we need not to set  JAVA_HOME again
      - mysql  
      state: present

  # - name: find java 25 path
  #   shell: readlink -f $(ls /usr/lib/jvm/java-25-openjdk*/bin/java | head -1)
  #   register: java25

  # - name: print the output
  #   debug:
  #     msg: "{{ java25 }}"

  # - name: make java25 as default
  #   command: alternatives --set java {{ java25.stdout }}

  # - name: set JAVA_HOME
  #   copy:
  #     content: "export JAVA_HOME={{ java25.stdout | dirname | dirname }}"
  #     dest: /etc/profile.d/java.sh
  
  - name: creating system user
    user:
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/nologin
      comment: "roboshop system user"
  
  - name: remove old directory
    file:
      path: /app
      state: absent
  
  - name: remove shipping.zip
    file:
      path: /tmp/shipping.zip
      state: absent
  
  - name: creating app directory
    file:
      path: /app
      state: directory
  
  - name: dowloading shipping application
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/shipping-v4.zip
      dest: /tmp/shipping.zip

  - name: unzip shipping
    unarchive:
      src: /tmp/shipping.zip
      dest: /app
      remote_src: yes
  
  - name: mvn version without JAVA_HOME
    command: mvn --version
    args: 
      child: /app
    register: mv_default
  
  - name: printing the maven version in /app
    debug:
      msg: "{{ mv_default.stdout_lines }}"
  
  - name: installing dependencies
    command: mvn clean package
    args:
      chdir: /app

  - name: moving the jar file
    command: mv target/shipping.jar shipping.jar
    args:
      child: /app

  - name: checking the count in the shipping database
    command: mysql -h "{{ shipping_host }}" -u root -p"{{ mysql_root_password }}" -N -B -e "SELECT COUNT(*) FROM cities.cities;"
    register: cities_count
  
  - name: print the cities_count
    debug:
      msg: "{{ cities_count }}"

  - name: loading cities data into mysql
    shell: mysql -h "{{ shipping_host }}" -uroot -p"{{ mysql_root_password }}" < /app/db/master-data.sql
    when: cities_count.rc != 0 or cities_count.stdout == 0
  
  - name: creating app user
    shell: mysql -h "{{ shipping_host }}" -uroot -p"{{ mysql_root_password }}" < /app/db/app-user.sql

  - name: copying shipping service
    template:
      src: shipping.service.j2
      dest: /etc/systemd/system/shipping.service

  - name: daemon reload
    systemd.service:
      daemon_reload: true
  
  - name: start and enable service
    service:  
      name: shipping
      state: restarted
      enbled: yes





