- name: configure user module
  hosts: user
  become: yes
  tasks:
  - name: disable default nodejs
    command: dnf module disable nodejs -y
  - name: enable node js
    command: dnf module enable nodejs:24 -y
  
  - name: installing nodejs
    dnf:
      name: nodejs 
      state: present

  - name: creating system user
    user: 
      name: roboshop
      create_home: false
      home: /app
      system: true
      shell: /sbin/login
      comment: "roboshop system user"

  - name: removing old directory
    file:
      path: /app
      state: absent
  
  - name: remove user.zip
    file:
      path: /tmp/user.zip
      state: absent
  
  - name: creating app directory
    file: /app
    state: directory

  - name: downloading user application
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/user-v4.zip
      dest: /tmp/user.zip
  
  - name: unzip user
    unarchive:
      src: /tmp/user.zip
      dest: /app
      remote_src: yes

  - name: install dependencies
    community.general.npm:
      dest: /app
  
  - name: copy user service
    template:
      src: user.service.j2
      dest: /etc/systemd/system/user.service

  - name: daemon reload
    systemd.service:
      daemon_relaod: true
  
  - name: start and enable
    service: 
      name: user
      state: restarted
      enalbed: yes





    
  



    