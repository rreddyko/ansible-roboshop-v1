- name: configuring rabbitmq 
  hosts: rabbitmq
  become: yes
  tasks:
  - name: copying repo rabbitmq
    copy:
      src: rabbitmq.repo
      dest: /etc/yum.repos.d/rabbitmq.repo
  
  - name: installing rabbitmq
    dnf:
      name:
      - erlang
      - rabbitmq-server
      state: present
  
  - name: starting service
    service:
      name: rabbitmq-server
      state: started
      enabled: yes
  
  - name: create rabbitmq user
    community.rabbitmq.rabbitmq_user:
      user: roboshop
      password: roboshop123
      vhost: /
      configure_priv: .*
      read_priv: .*
      write_priv: .*
      state: present