- name: create ec2-instance
  hosts: localhost
  connection: local
  vars: 
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain: "rameshkotha572.online"
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2-instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      security_groups:
      - roboshop-common
      - "roboshop-{{ item }}"
      region: us-east-1
    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output

  - name: print ec2_output
    debug:
      msg: "{{ ec2_output }}"



