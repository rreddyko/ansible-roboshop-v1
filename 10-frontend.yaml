- name: configure frontend server
  hosts: frontend
  become: yes
  tasks:
  - name: enable nginx 1.26
    command: dnf module enable nginx:1.26 -y
  
  - name: install nginx
    dnf:
      name: nginx
      state: present

  - name: start and enable nginx
    service:
      name: nginx
      state: started
      enabled: yes
  
  - name: find all the contents in the directory
    ansible.builtin.find:
      paths: /usr/share/nginx/html/
      recurse: true
      hidden: true
      file_type: any
    register: directory_contents
  
  - name: print the discovery contents
    debug:
      msg: "{{ directory_contents }}"
  
  - name: delete the discovered contents
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ directory_contents.files }}"
  
  - name: downlading the application
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/frontend-v4.zip
      dest: /tmp/frontend.zip
  
  - name: unzip frontend
    unarchive: 
      src: /tmp/frontend.zip
      dest: /usr/share/nginx/html/
      remote_src: yes

  - name: copy roboshop config
    template:
      src: roboshop.conf.j2
      dest: /etc/nginx/default.d/roboshop.conf
      
  - name: print the user_host
    debug:
      msg: "{{ user_host }}"
  
  - name: restart nginx
    service:
      name: nginx
      state: restarted
      

  

  



